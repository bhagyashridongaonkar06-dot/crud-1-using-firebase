<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">                                                     
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student using firebase</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
        integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header text-center">Student Curd</div>
                    <div class="card-body">
                        <form id="studForm">
                            <div class="form-group">
                                <label for="fname">First Name</label>
                                <input type="text" class="form-control" required id="fname">
                            </div>
                            <div class="form-group">
                                <label for="lname">Last Name</label>
                                <input type="text" class="form-control" required id="lname">
                            </div>
                            <div class="form-group">
                                <label for="email">E-Mail</label>
                                <input type="text" class="form-control" required id="email">
                            </div>
                            <div class="form-group">
                                <label for="contact">Contact</label>
                                <input type="number" class="form-control" required id="contact">
                            </div>
                            <button class="btn btn-sm btn-block btn-primary" type="submit" id="addStd">Add
                                Student</button>
                            <button class="btn btn-sm btn-block btn-success d-none" type="button"
                                id="updateStd">Update Student</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <div class="container-fluid mt-5">
        <div class="row">
            <div class="col-md-10 offset-1">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover">
                        <thead>
                            <tr>
                                <th>Sr No</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Email</th>
                                <th>Contact No</th>
                                <th>Edit</th>
                                <th>Remove</th>
                            </tr>
                        </thead>


                        <tbody id="studentContainer">
                            <!-- <tr>
                                <td>1</td>
                                <td>Jhon</td>
                                <td>Doe</td>
                                <td>jd@gmail.com</td>
                                <td>123456</td>
                                <td><button class="btn btn-sm btn-success text-white"><i class="fa-regular fa-pen-to-square fa-2x"></i></button></td>
                                <td><button class="btn btn-sm btn-danger text-white"><i class="fa-solid fa-trash fa-2x"></i></button></td>
                            </tr> -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>    


</html>
